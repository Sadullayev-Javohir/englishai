# Serves the built SPA. API/hub/health routing is handled upstream by Caddy, so this
# server only needs to serve static assets with an index.html fallback for client routes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ES module scripts (.mjs) are not in nginx's default mime.types, so they fall back to
    # application/octet-stream and are rejected under strict MIME checking (x-content-type-options:
    # nosniff). The onnxruntime-web engine that powers voice activity detection ships as a .mjs
    # module — without this it fails to load and the recorder degrades to a crude fallback that
    # mishears speech. A regex location outranks /assets/, so repeat the immutable caching here.
    location ~* \.mjs$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        default_type text/javascript;
        try_files $uri =404;
    }

    # WebAssembly modules (onnxruntime-web) must be served as application/wasm for streaming
    # compilation. The base image maps this today, but pin it so a future image cannot regress.
    location ~* \.wasm$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        default_type application/wasm;
        try_files $uri =404;
    }

    # Search engines request the conventional root favicon directly. Serve a real icon instead
    # of falling through to the SPA HTML, and force revalidation while crawlers refresh it.
    location = /favicon.ico {
        default_type image/x-icon;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location = /favicon.png {
        default_type image/png;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    # Android APK direct download. Forces the correct install mime-type and a save dialog, and
    # disables caching so a freshly shipped build is never served stale. Real file → served
    # before the SPA fallback.
    location /downloads/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Public pages are emitted as route-specific static HTML. They intentionally receive no
    # X-Robots-Tag noindex header and never fall back to the authenticated SPA document.
    include /etc/nginx/seo-routes.conf;

    # Signed-in learners may revisit the marketing page explicitly. It is intentionally
    # excluded from the sitemap and canonicalizes to /, so prevent duplicate indexing.
    location = /landing {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /landing/index.html =404;
    }


    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$ {
        try_files $uri =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
