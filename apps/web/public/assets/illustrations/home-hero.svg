<svg width="360" height="380" viewBox="0 0 360 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kitob ustidagi to'tiqush">
  <defs>
    <linearGradient id="hh-body" x1="80" y1="80" x2="270" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ad9bd"/>
      <stop offset=".55" stop-color="#16b39c"/>
      <stop offset="1" stop-color="#0e8577"/>
    </linearGradient>
    <linearGradient id="hh-wing" x1="110" y1="150" x2="200" y2="320" gradientUnits="userSpaceOnUse">
